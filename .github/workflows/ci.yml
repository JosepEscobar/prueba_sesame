name: CI/CD Pipeline

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  build-test-lint:
    name: Build, Lint, Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m venv .venv
        source .venv/bin/activate
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff black pytest pytest-cov

    - name: Lint with Ruff
      run: |
        source .venv/bin/activate
        ruff .

    - name: Check formatting with Black
      run: |
        source .venv/bin/activate
        black --check .

    - name: Run tests with pytest
      run: |
        source .venv/bin/activate
        pytest --cov=app --cov-report=term-missing

  docker-build-push:
    name: Docker Build and Push
    needs: build-test-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and tag Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/multi-agent-ia:${{ github.sha }} .
        docker tag ${{ secrets.DOCKER_USERNAME }}/multi-agent-ia:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/multi-agent-ia:latest

    - name: Push Docker image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/multi-agent-ia:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/multi-agent-ia:latest

  deploy-to-env:
    name: Deploy to Server
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master'

    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/multi-agent-ia:latest
          docker stop multi-agent-ia || true
          docker rm multi-agent-ia || true
          docker run -d --env-file /path/to/your/.env --name multi-agent-ia -p 8000:8000 ${{ secrets.DOCKER_USERNAME }}/multi-agent-ia:latest
