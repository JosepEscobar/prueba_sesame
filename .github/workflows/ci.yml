name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-api-server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    defaults:
      run:
        working-directory: api_server

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Ruff
      run: |
        pip install ruff
        ruff check .

    - name: Run tests
      run: |
        pytest --cov=app --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./api_server/coverage.xml
        flags: api-server
        fail_ci_if_error: true

  test-mcp-server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    defaults:
      run:
        working-directory: mcp_server

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Ruff
      run: |
        pip install ruff
        ruff check .

    - name: Run tests
      run: |
        pytest --cov=app --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./mcp_server/coverage.xml
        flags: mcp-server
        fail_ci_if_error: true

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint with ESLint
      run: npm run lint || true

    - name: Build
      run: npm run build

  build-and-push:
    needs: [test-api-server, test-mcp-server, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and push API Server
      uses: docker/build-push-action@v5
      with:
        context: ./api_server
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/sesame-api:latest
          ghcr.io/${{ github.repository_owner }}/sesame-api:${{ github.sha }}
          
    - name: Build and push MCP Server
      uses: docker/build-push-action@v5
      with:
        context: ./mcp_server
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/sesame-mcp:latest
          ghcr.io/${{ github.repository_owner }}/sesame-mcp:${{ github.sha }}
          
    - name: Build and push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/sesame-frontend:latest
          ghcr.io/${{ github.repository_owner }}/sesame-frontend:${{ github.sha }}
