global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "api_server"
    metrics_path: /metrics
    static_configs:
      - targets: ["api_server:8000"]

  - job_name: "mcp_server"
    metrics_path: /metrics
    static_configs:
      - targets: ["mcp_server:4000"] 