version: '3.8'

services:
  mcp_server:
    build:
      context: ./mcp_server
    container_name: mcp_server
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
    volumes:
      - ./mcp_server/logs:/app/logs
    restart: unless-stopped

  api_server:
    build:
      context: ./api_server
    container_name: api_server
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
      - MCP_CLIENT_URL=http://mcp_server:4000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - TEMPERATURE=${TEMPERATURE}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - BING_SEARCH_API_KEY=${BING_SEARCH_API_KEY}
    depends_on:
      - mcp_server
    volumes:
      - ./api_server/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data: 