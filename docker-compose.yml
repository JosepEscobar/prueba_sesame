version: '3'

services:
  api_server:
    build: ./api_server
    ports:
      - "8000:8000"
    volumes:
      - ./api_server/logs:/app/logs
    env_file:
      - ./api_server/.env
    depends_on:
      - mcp_server
    networks:
      - sesame_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
      
  mcp_server:
    build: ./mcp_server
    ports:
      - "4000:4000"
    volumes:
      - ./mcp_server/logs:/app/logs
    env_file:
      - ./mcp_server/.env
    networks:
      - sesame_network
    restart: unless-stopped

networks:
  sesame_network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data: 